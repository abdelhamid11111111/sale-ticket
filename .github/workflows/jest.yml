# 1. NAME OF THE WORKFLOW
name: Jest Tests

# 2. WHEN TO RUN (triggers)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# 3. JOBS (what to do)
jobs:
  jest:                        # job name (you choose)
    name: Run Jest Tests       # display name in GitHub
    runs-on: ubuntu-latest     # what machine to run on

# 4. ENV VARS (available to all steps)
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

# 5. STEPS (commands to run in order)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install ts-node
        run: npm install ts-node --no-save

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npx jest --testPathPatterns=unit --ci --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Run integration tests
        run: npx jest --testPathPatterns=integration --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7